<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Cardápio do Dia — Etiquetas</title>
  <meta name="description" content="Gera um PDF de etiquetas recortáveis com os pratos do dia. Funciona sem internet.">

  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#18181b">

  <link rel="icon" type="image/svg+xml" href="./icone.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <!-- iOS ignora o manifest: precisa destas tags para abrir em tela cheia. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cardápio">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Splash do iOS, uma imagem por tamanho de tela. -->
  <link rel="apple-touch-startup-image" href="./splash-1290x2796.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="./splash-1179x2556.png"
        media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="./splash-1170x2532.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="./splash-1125x2436.png"
        media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)">
  <link rel="apple-touch-startup-image" href="./splash-750x1334.png"
        media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)">
  <link rel="apple-touch-startup-image" href="./splash-1536x2048.png"
        media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Cardápio do Dia — Etiquetas">
  <meta property="og:description" content="Gera um PDF de etiquetas recortáveis com os pratos do dia.">
  <meta property="og:image" content="./icone-512.png">
  <meta property="og:locale" content="pt_BR">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
